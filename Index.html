      for (let m = 0; m < 12; m++) {
        const sa = poisson(base * SEASON[m]);
        const p = clamp(attach + trend * (m - 5.5) / 5.5 + normal() * .03, .05, .85);
        const ins = binom(sa, p);
        const q = Math.min(sa, ins + binom(sa - ins, 1 - qc + .25));
        b.sa.push(sa); b.q.push(Math.max(q, ins)); b.ins.push(ins);

  }

  [uk[20], uk[33], uk[47]].forEach((u, k) => { u.speed = .86 + k * .03; u.ft = .06; u.pop = 3.2 - k * .4; u.cqs = true; });

  for (const b of branches) {

  return { firms, branches, tx, invoices, uk, npl };

function isLive(t) { return t.st === 'In progress' || t.st === 'Awaiting acceptance' || t.st === 'Exchanged' || t.st === 'On hold'; }

function reqSkills(t) {
  const s = [t.ten];
  if (t.nb) s.push('New build'); if (t.so) s.push('Shared ownership'); if (t.ur) s.push('Unregistered land');
  if (t.pr) s.push('Probate sale'); if (t.rtb) s.push('Right to buy'); if (t.price >= 1e6) s.push('High value (£1m+)');
  return s;
}

function firmSpeed(f, day) { let s = f.speed; if (f.decline) { const mi = (day - MSTART[6]) / (MSTART[11] + 30 - MSTART[6]); s *= 1 + .5 * clamp(mi, 0, 1); } return s; }
function firmCsat(f, day) { let c = f.csat; if (f.decline) c -= .85 * clamp((day - MSTART[7]) / (TODAY - MSTART[7]), 0, 1); return c; }
function firmFt(f, day) { let x = f.ft; if (f.decline) x += .07 * clamp((day - MSTART[7]) / (TODAY - MSTART[7]), 0, 1); return x; }

function makeTx(b, r, m, seq, firms) {
  const dim = MSTART[m + 1] - MSTART[m];
  let d = MSTART[m] + ri(0, dim - 1); if (d > TODAY) d = TODAY - ri(0, 3);
  const type = wpick(['Sale', 'Purchase', 'Sale & Purchase'], [45, 35, 20]);
  const ten = R() < r.lease ? 'Leasehold' : 'Freehold';
  const nb = type !== 'Sale' && R() < .08, so = R() < .03, ur = ten === 'Freehold' && R() < .035, pr = type === 'Sale' && R() < .09, rtb = R() < .012;
  let price = Math.round(r.price * Math.exp(normal() * .38) * (nb ? 1.08 : 1) / 1000) * 1000; price = Math.max(price, 70000);
  const mort = type !== 'Sale' ? R() < .74 : R() < .7;
  const t = { id: 'HL-' + seq, b: b.i, r: r.id, m, d, type, ten, nb, so, ur, pr, rtb, price, mort };
  const need = reqSkills(t);
  const elig = firms.filter(f => f.regions.includes(r.id) && need.every(s => f.skills.includes(s)));
  const w = elig.map(f => f.share * (nb && f.nb ? 4 : 1) * (f.hq === r.id ? 1.4 : 1) * (f.id === 'F11' && d > MSTART[10] + 14 ? .5 : 1));
  const f = wpick(elig, w);
  t.f = f.id;
  t.client = pick(TITLE) + ' ' + pick(SURN);
  t.addr = ri(1, 180) + ' ' + pick(STREETS) + ', ' + b.town;
  t.pc = pick(r.pc) + ri(1, 22) + ' ' + ri(1, 9) + String.fromCharCode(65 + ri(0, 25)) + String.fromCharCode(65 + ri(0, 25));
  // milestones
  const ms = new Array(10).fill(null); ms[0] = d;
  let cur = d; let st = 'In progress';
  const ftStage = R() < firmFt(f, d + 40) ? ri(2, 8) : 0;
  for (let s = 1; s < 10; s++) {
    if (s === 7 && !mort) { ms[7] = -1; continue; }
    let dur = STAGES[s].base * firmSpeed(f, cur) * Math.exp(normal() * .35);
    if (ten === 'Leasehold' && (s === 5 || s === 6)) dur *= 1.45;
    if (nb && s === 8) dur *= 1.5;
    if (s === 1) dur = Math.max(1, STAGES[1].base * (R() < f.aml ? .8 : 2.1) * Math.exp(normal() * .3));
    cur += Math.max(1, Math.round(dur));
    if (ftStage && s === ftStage) { const fd = cur - ri(0, 3); if (fd <= TODAY) { st = 'Fallen through'; t.fall = fd; t.fallStage = s; t.fallReason = pick(['Buyer withdrew', 'Mortgage declined', 'Chain collapse', 'Survey issues', 'Seller withdrew', 'Gazumped']); } break; }
    if (cur > TODAY) break;
    ms[s] = cur;
  }
  t.ms = ms;
  if (st !== 'Fallen through') { if (ms[9] != null) st = 'Completed'; else if (ms[8] != null) st = 'Exchanged'; else if (d >= TODAY - 1 && R() < .65) st = 'Awaiting acceptance'; else if (R() < .02) st = 'On hold'; }
  t.st = st;
  const lastMs = Math.max(...ms.filter(x => x != null && x >= 0));
  if (st === 'Completed') t.lu = ms[9];
  else if (st === 'Fallen through') t.lu = t.fall;
  else { const timely = R() < f.disc; t.lu = Math.max(lastMs, TODAY - (timely ? ri(0, 9) : ri(15, 45))); }
  if (st === 'Completed') t.csat = clamp(Math.round(firmCsat(f, ms[9]) + normal() * .75), 1, 5);
  t.fee = type === 'Sale & Purchase' ? f.spFee : f.fee;
  t.src = wpick(SOURCES, [80, 12, 6, 2]);
  t.notes = [];
  return t;
}

function genInvoices(tx, firms) {
  const inv = []; let no = 4100;
  const by = {}; // firm|month -> list
  tx.forEach(t => { if (t.st === 'Completed') { const mm = midx(t.ms[9]); const k = t.f + '|' + mm; (by[k] = by[k] || []).push(t); } });
  for (let m = DETAIL_FROM; m < 11; m++) {
    for (const f of firms) {
      const list = by[f.id + '|' + m]; if (!list) continue;
      inv.push(makeInvoice(f, m, list, ++no, true));
    }
  }
  return inv;
}

function makeInvoice(f, m, list, no, simulatePay) {

  <div class="form g4"><div><label class="fl">Group by</label>${sel('bd', Object.entries(D), RP.dim)}</div><div><label class="fl">Measure</label>${sel('bm', Object.entries(M), RP.meas)}</div><div><label class="fl">Instructed in</label>${sel('bp', [['1', 'Last month'], ['3', 'Last 3 months'], ['6', 'Last 6 months']], RP.pk)}</div><div><label class="fl">Region filter</label>${S.persona.role === 'region' ? `<input disabled value="${REG[S.persona.region].name}">` : sel('br', [['', 'All regions']].concat(REGIONS.map(r => [r.id, r.name])), RP.reg)}</div></div>

  const P = PERIODS[RP.pk];

  const g = {};
  S.tx.forEach(t => { if (!P.includes(t.m) || (reg && t.r !== reg)) return; const k = key(t); const x = g[k] = g[k] || { k, n: 0, comp: 0, exD: 0, exN: 0, fall: 0, fees: 0, price: 0 }; x.n++; x.price += t.price; if (t.st === 'Completed') { x.comp++; x.fees += t.fee; } if (t.ms[8] != null) { x.exN++; x.exD += t.ms[8] - t.ms[0]; } if (t.st === 'Fallen through') x.fall++; });
  const val = x => ({ ins: x.n, comp: x.comp, exch: x.exN ? x.exD / x.exN : null, ft: (x.fall + x.exN) ? x.fall / (x.fall + x.exN) : 0, fees: x.fees, price: x.price / x.n })[RP.meas];

  dataTable($('#btab'), { rows, pageSize: 10, sort: RP.dim === 'month' ? null : ['v', -1], cols: [{ k: 'k', label: D[RP.dim] }, { k: 'n', label: 'Instructions', r: 1, f: r => num(r.n) }, { k: 'v', label: M[RP.meas], r: 1, f: r => `<b>${fm(r.v)}</b>` }] });

  const rn = $('#crun'); if (rn) rn.onclick = () => { let n = 0; od.forEach(v => { const a = chaseNext(v); if (!a) return; if (a.startsWith('Escalate')) v.escalated = true; else v.reminders++; S.chaseLog.push({ day: TODAY, no: v.no, f: v.f, stage: a, amt: v.total - v.paid }); audit('Finance', 'Automated chase: ' + a, FIRM(v.f).name, v.no + ' · ' + gbp(v.total - v.paid)); n++; }); save(); render(); toast(n ? n + ' chase actions sent' : 'Nothing due today'); };
}
function fnRecon(b) {
  const rows = S.firms.map(f => { const V = S.invoices.filter(v => v.f === f.id); const tc = V.reduce((a, v) => a + v.count, 0), dc = V.reduce((a, v) => a + v.declared, 0); const inv = V.reduce((a, v) => a + v.total, 0), pd = V.reduce((a, v) => a + v.paid, 0); const sp = V.filter(v => v.paid > 0 && v.paid < v.total).reduce((a, v) => a + v.total - v.paid, 0); const ub = (unbilled()[f.id] || []).length; return { f, tc, dc, var: tc - dc, inv, pd, sp, ub }; });
  b.innerHTML = `<div class="card"><div class="ch"><h3>Revenue assurance</h3><span class="muted sm">Completions tracked in HomeLink vs what each firm declares and pays</span></div><div id="rec"></div></div><p class="note">Variance means the firm’s remittance advice lists fewer completions than HomeLink milestone data shows. Raise a query so the fees are recovered or the data corrected.</p>`;
  dataTable($('#rec'), { rows, sort: ['var', -1], pageSize: 20, cols: [
    { k: 'n', label: 'Firm', v: r => r.f.name, f: r => `<b>${esc(r.f.name)}</b>` }, { k: 'tc', label: 'Tracked completions', r: 1 }, { k: 'dc', label: 'Firm declared', r: 1 },
    { k: 'var', label: 'Variance', r: 1, f: r => r.var ? `<span class="neg"><b>${r.var}</b></span>` : '0' }, { k: 'inv', label: 'Invoiced', r: 1, f: r => gbp(r.inv) }, { k: 'pd', label: 'Received', r: 1, f: r => gbp(r.pd) },
    { k: 'sp', label: 'Short-paid', r: 1, f: r => r.sp ? `<span class="neg">${gbp(r.sp)}</span>` : '—' }, { k: 'ub', label: 'Unbilled', r: 1 },
    { k: 'x', label: '', nosort: 1, f: r => r.var || r.sp ? (canFin() ? `<button class="btn sm" data-q="${r.f.id}">Raise query</button>` : badge('Query', 'warning')) : badge('Reconciled', 'good') }],
    after: el => $$('[data-q]', el).forEach(x => x.onclick = () => { const f = FIRM(x.dataset.q); audit('Finance', 'Reconciliation query raised', f.name, 'Variance in declared completions / short payment'); toast('Query sent to ' + f.email); }) });
}

    dataTable($('#paw'), { rows: aw, pageSize: 6, empty: 'No new instructions waiting.', cols: [{ k: 'id', label: 'Ref', f: t => `<b>${t.id}</b>` }, { k: 'client', label: 'Client', f: t => `${esc(t.client)}<small class="db">${esc(t.addr)}</small>` }, { k: 'type', label: 'Type', f: t => t.type + '<small class="db">' + t.ten + '</small>' }, { k: 'x', label: '', nosort: 1, f: t => `<button class="btn sm pri" data-acc="${t.id}">Accept</button> <button class="btn sm" data-dec="${t.id}">Decline</button>` }], onRow: t => txDrawer(t, true), after: e => { $$('[data-acc]', e).forEach(x => x.onclick = () => { acceptTx(S.tx.find(t => t.id === x.dataset.acc)); render(); }); $$('[data-dec]', e).forEach(x => x.onclick = () => declineTx(S.tx.find(t => t.id === x.dataset.dec), render)); } });

function bulkUpload(text) {
  const lines = text.split(/\r?\n/).filter(l => l.trim() && !l.startsWith('#')); const ok = [], bad = [];
  const idx = {}; myTx().forEach(t => idx[t.id] = t);
  lines.slice(1).forEach((l, n) => { const [ref, ms, date, ...note] = l.split(',').map(s => s.trim()); const t = idx[ref]; const s = STAGES.findIndex(x => x.k === ms || x.name.toLowerCase() === (ms || '').toLowerCase()); let d; try { d = fromIso(date); } catch (e) { d = NaN; }
    if (!t) return bad.push(`Row ${n + 2}: ${ref || '(blank)'} is not one of your files`); if (s < 1) return bad.push(`Row ${n + 2}: unknown milestone “${ms}”`); if (isNaN(d) || d > TODAY || d < t.d) return bad.push(`Row ${n + 2}: invalid date ${date}`); if (!isLive(t) || t.st === 'Awaiting acceptance') return bad.push(`Row ${n + 2}: ${ref} is not a live, accepted file`);
    t.ms[s] = d; if (s >= 7 && !t.mort && t.ms[7] == null) t.ms[7] = -1; t.st = s === 9 ? 'Completed' : s === 8 ? 'Exchanged' : t.st === 'On hold' ? 'On hold' : 'In progress'; t.lu = TODAY; t.notes.push({ d: TODAY, by: who(), text: STAGES[s].name + ' recorded for ' + fdate(d) + ' (bulk upload)' + (note.length ? ': ' + note.join(',') : '') }); saveTx(t); ok.push(ref + ' · ' + STAGES[s].name); });
  if (ok.length) audit('Firm portal', 'Bulk milestone upload', FIRM(myId()).name, ok.length + ' milestones · ' + bad.length + ' rejected');
  openModal({ title: 'Bulk upload results', body: `<p><b>${ok.length}</b> milestones recorded, <b>${bad.length}</b> rows rejected.</p>${ok.length ? '<ul class="plain sm">' + ok.slice(0, 20).map(x => `<li>✓ ${esc(x)}</li>`).join('') + '</ul>' : ''}${bad.length ? '<ul class="plain sm neg">' + bad.slice(0, 20).map(x => `<li>✕ ${esc(x)}</li>`).join('') + '</ul>' : ''}`, actions: [{ label: 'Done', primary: true, fn: () => render() }] });
}
